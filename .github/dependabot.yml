version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      tauri-compatible:
        patterns:
          - "tauri"
          - "tauri-*"
        update-types:
          - "minor"
          - "patch"
      rust-compatible:
        patterns:
          - "*"
        exclude-patterns:
          - "tauri"
          - "tauri-*"
        update-types:
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
