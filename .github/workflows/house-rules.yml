name: House Rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate repository governance
        run: python3 scripts/check_house_rules.py
