name: Headless core probe

on:
  pull_request:
    paths:
      - 'experiments/core-probe/**'
      - 'backend/src/**'
      - '.github/workflows/core-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/core-probe
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Fast format check
        run: cargo fmt --all -- --check
      - name: Resolve candidate lock
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo metadata --locked --format-version 1 --no-deps
      - name: Export candidate lock
        shell: bash
        run: |
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            sha256sum Cargo.lock
            test "$(wc -c < Cargo.lock)" -le 524288
            base64 -w 768 Cargo.lock | sed 's/^/CORE_LOCK_CANDIDATE:/'
          fi
      - name: Upload lock candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-probe-lock
          path: experiments/core-probe/Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Install serial prerequisites only
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Verify headless dependency closure
        shell: bash
        run: |
          cargo tree --locked --prefix none --edges normal,build --format '{p}' > "$RUNNER_TEMP/core-tree.txt"
          cat "$RUNNER_TEMP/core-tree.txt"
          if grep -E '^(tauri([ -]|$)|wry |webkit2gtk([ -]|$)|slint([ -]|$)|i-slint-)' "$RUNNER_TEMP/core-tree.txt"; then
            echo 'GUI dependency in headless core'
            exit 1
          fi
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build (no publishing)
        run: cargo build --release --locked
      - name: Verify tracked manifests unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock
