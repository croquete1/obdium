name: Slint preview bootstrap

on:
  pull_request:
    paths:
      - 'experiments/slint-preview/**'
      - '.github/workflows/slint-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experiments/slint-preview
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
      - name: Generate candidate lock only if absent
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi
          cargo metadata --locked --format-version 1 --no-deps
      - name: Upload lock candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slint-preview-lock
          path: experiments/slint-preview/Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Export public lock candidate for exact readback
        shell: bash
        run: |
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            sha256sum Cargo.lock
            base64 -w 768 Cargo.lock | sed 's/^/LOCK_CANDIDATE:/'
          fi
      - name: Fast Rust formatting check
        run: cargo fmt --all -- --check
      - name: Install Linux native window prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev xinput libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libwayland-dev libfontconfig1-dev
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build (no publishing)
        run: cargo build --release --locked
      - name: Verify manifests unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock
