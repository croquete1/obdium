name: Slint preview

on:
  pull_request:
    paths:
      - 'experiments/slint-preview/**'
      - '.github/workflows/slint-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Slint preview / format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/slint-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          rustup default 1.100.0
      - name: Require committed lock
        run: git ls-files --error-unmatch Cargo.lock
      - name: Fast Rust formatting check
        run: cargo fmt --all -- --check
      - name: Capture formatting patch
        if: failure()
        run: |
          cargo fmt --all
          git diff --binary -- . > "$RUNNER_TEMP/slint-rustfmt.patch"
          git restore --worktree -- .
      - name: Upload formatting patch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: slint-rustfmt-patch
          path: ${{ runner.temp }}/slint-rustfmt.patch
          if-no-files-found: warn
          retention-days: 7
  native:
    name: Slint preview / ${{ matrix.os }}
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: experiments/slint-preview
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy
          rustup default 1.100.0
      - name: Verify locked resolution
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Install Linux native window prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev xinput libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libwayland-dev libfontconfig1-dev
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build (no publishing)
        run: cargo build --release --locked
      - name: Verify manifests unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock
