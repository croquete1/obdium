name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Retain active job evidence during bootstrap; a newer pending run may replace an older pending one.
  cancel-in-progress: false

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and components
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.100.0
          rustc --version
          cargo --version
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - name: Verify locked resolution
        id: metadata
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Rustfmt
        id: rustfmt
        if: runner.os == 'Linux' && steps.metadata.outcome == 'success'
        run: cargo fmt --all -- --check
      - name: Capture official formatting patch on failure
        if: ${{ failure() && runner.os == 'Linux' && steps.rustfmt.outcome == 'failure' }}
        run: |
          cargo fmt --all
          git diff --binary -- . > "$RUNNER_TEMP/rustfmt.patch"
          git restore --worktree -- .
      - name: Upload formatting patch
        if: ${{ failure() && runner.os == 'Linux' && steps.rustfmt.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Upload Clippy diagnostics on failure
        if: ${{ failure() && steps.clippy.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy-${{ matrix.os }}
          path: ${{ runner.temp }}/clippy.log
          if-no-files-found: error
          retention-days: 7
      - name: Tests
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: cargo test --locked
      - name: Release build (no publishing)
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: cargo build --release --locked
      - name: Check tracked changes
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: git diff --exit-code -- Cargo.lock Cargo.toml

  frontend:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --version
          find frontend -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check
      - name: DTC safety regression guards
        run: node --test frontend/tests/dtc-clear-safety.test.mjs frontend/tests/literal-rendering.test.mjs frontend/tests/json-export.test.mjs
