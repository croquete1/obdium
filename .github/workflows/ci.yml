name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - name: Verify locked resolution
        id: metadata
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Rustfmt
        if: runner.os == 'Linux' && steps.metadata.outcome == 'success'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: cargo test --locked
      - name: Release build (no publishing)
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: cargo build --release --locked
      - name: Check tracked changes
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: git diff --exit-code -- Cargo.lock Cargo.toml

  frontend:
    name: Frontend JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --version
          find frontend -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
