[package]
name = "obdium"
version = "1.5.0"
edition = "2021"

[dependencies]
serialport = "4.10.1"
xz2 = "0.1.7"
sqlite = { version = "0.37.4", features = ["bundled"] }
chrono = "0.4.45"
num_enum = "0.7.6"
thiserror = "2.0.21"
regex = "1.13.2"
evalexpr = "12.0.3"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tokio = "1.54.1"
rand = "0.9.5"
once_cell = "1.21.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
